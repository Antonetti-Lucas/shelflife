<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShelfLife{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
  <script src="/static/tags.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">ShelfLife</a>
    <nav>
      {% set path = request.url.path %}
      <a href="/" class="{{ 'on' if path == '/' }}">Recommendations</a>
      <a href="/library" class="{{ 'on' if path == '/library' }}">Library</a>
      <a href="/explore" class="{{ 'on' if path == '/explore' }}">Explore</a>
      <a href="/diary" class="{{ 'on' if path == '/diary' }}">Diary</a>
      <a href="/ratings" class="{{ 'on' if path == '/ratings' }}">My ratings</a>
      <a href="/stats" class="{{ 'on' if path == '/stats' }}">Stats</a>
      <a href="/taste" class="{{ 'on' if path == '/taste' }}">My taste</a>
      <a href="/sync" class="{{ 'on' if path == '/sync' }}">Sync</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
