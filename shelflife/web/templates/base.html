<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShelfLife{% endblock %}</title>
  <script>try { var t = localStorage.getItem("shelflife-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
  <script src="/static/tags.js" defer></script>
  <script src="/static/inline.js" defer></script>
  <script src="/static/stars.js" defer></script>
  <script src="/static/prices.js" defer></script>
  <script src="/static/lists.js" defer></script>
  <script src="/static/theme.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="7" width="4.5" height="12" rx="1" fill="#3fcf9b"/>
        <rect x="8.5" y="4" width="4.5" height="15" rx="1" fill="#2a9d74"/>
        <rect x="14.6" y="6.4" width="4.5" height="12.6" rx="1" fill="#7fe3bd" transform="rotate(12 16.85 19)"/>
        <rect x="1.5" y="19.5" width="21" height="2" rx="1" fill="#c9ced6"/>
      </svg>
      <span>ShelfLife</span></a>
    <nav>
      {% set path = request.url.path %}
      <a href="/" class="{{ 'on' if path == '/' }}">For you</a>
      <a href="/library" class="{{ 'on' if path == '/library' }}">Library</a>
      <a href="/explore" class="{{ 'on' if path == '/explore' }}">Explore</a>
      <a href="/wishlist" class="{{ 'on' if path == '/wishlist' }}">Wishlist</a>
      <a href="/diary" class="{{ 'on' if path == '/diary' }}">Diary</a>
      <a href="/ratings" class="{{ 'on' if path == '/ratings' }}">My ratings</a>
      <a href="/lists" class="{{ 'on' if path.startswith('/lists') }}">Lists</a>
      <a href="/stats" class="{{ 'on' if path == '/stats' }}">Stats</a>
      <span class="gap"></span>
      <a href="/taste" class="side {{ 'on' if path == '/taste' }}">My taste</a>
      <a href="/sync" class="side {{ 'on' if path == '/sync' }}">Sync</a>
      <button type="button" class="theme-toggle" hidden aria-label="Theme">◐</button>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
