# Database migrations (Alembic). The app runs them itself at start-up (shelflife/db.py, init_db);
# this file is only for making new ones: python -m alembic revision --autogenerate -m "what changed"
# The database is the same one the app uses (DATABASE_URL, or shelflife.db in the project folder).
[alembic]
script_location = %(here)s/shelflife/migrations
